[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[tool.uv]
required-version = "==0.12.21"
no-build = true

[project]
name = "seireth"
version = "0.1.0"
description = "Authorized, bounded security validation MVP"
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.141.1",
  "uvicorn[standard]>=0.29",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.3,<4",
  "alembic>=1.18,<2",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "httpx2>=2.0.0", "pytest-cov>=7,<8", "coverage[toml]>=7.10.6,<8"]
quality = ["ruff>=0.15,<0.17", "requests==2.25.1"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "database: requires an explicitly configured disposable PostgreSQL server",
  "docker: requires the real Docker daemon and prepared assessment images",
]

[tool.coverage.run]
source = ["app"]
relative_files = true
branch = true
patch = ["subprocess"]

[tool.setuptools]
packages = ["app", "app.api", "app.plugins"]
include-package-data = false

[tool.setuptools.package-data]
app = ["migrations/*.py", "migrations/versions/*.py", "migrations/*.mako", "web/dist/*", "web/dist/assets/*"]

[tool.alembic]
script_location = "%(here)s/app/migrations"
prepend_sys_path = ["."]
