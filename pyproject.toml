[project]
name = "seireth"
version = "0.1.0"
description = "Authorized, bounded security validation MVP"
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.3,<4",
  "alembic>=1.18,<2",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "httpx2>=2.0.0"]
quality = ["ruff>=0.15,<0.17"]
security = ["pip-audit>=2.9,<3"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
packages = ["app", "app.plugins"]

[tool.setuptools.package-data]
app = ["migrations/*.py", "migrations/versions/*.py", "migrations/*.mako"]

[tool.alembic]
script_location = "%(here)s/app/migrations"
prepend_sys_path = ["."]
