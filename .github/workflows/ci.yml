name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Check required files and tracked environment files
        run: |
          set -euo pipefail
          for file in README.md CONTRIBUTING.md SECURITY.md LICENSE docs/{getting-started,architecture,configuration,assessments,plugins,security-model,roadmap}.md docs/assets/seireth-logo.png; do
            test -f "$file" || { echo "::error file=$file::Required file is missing"; exit 1; }
          done
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '(^|/)\.env\.example$'; then
            echo "::error::A non-example environment file is tracked"
            exit 1
          fi

  quality:
    name: Python quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.21"
      - run: uv sync --locked --extra quality
      - run: uv run --no-sync python -m ruff check --output-format=github . .github/scripts
      - run: uv run --no-sync python -m ruff format --check . .github/scripts

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24.16.0"
          cache: npm
          cache-dependency-path: app/web/package-lock.json
      - run: npm install --global --ignore-scripts npm@11.13.0
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
