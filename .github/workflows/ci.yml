name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Check required files and tracked environment files
        run: |
          set -euo pipefail
          for file in README.md CONTRIBUTING.md SECURITY.md LICENSE docs/{getting-started,architecture,configuration,assessments,plugins,security-model,roadmap}.md docs/assets/seireth-logo.png; do
            test -f "$file" || { echo "::error file=$file::Required file is missing"; exit 1; }
          done
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '(^|/)\.env\.example$'; then
            echo "::error::A non-example environment file is tracked"
            exit 1
          fi

  quality:
    name: Python quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - &setup-python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - &setup-uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.9"
      - run: uv sync --locked --extra quality
      - run: uv run --no-sync python -m ruff check --output-format=github . .github/scripts
      - run: uv run --no-sync python -m ruff format --check . .github/scripts

  tests:
    name: Python 3.14 tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: seireth-tests
    steps:
      - uses: actions/checkout@v7
      - *setup-python
      - *setup-uv
      - &prepare-ci-env
        name: Generate disposable database credentials
        run: python .github/scripts/prepare_ci_env.py
      - run: uv sync --locked --extra test
      - name: Start PostgreSQL
        run: docker compose up --wait --wait-timeout 60 postgres
      # conftest creates and drops a uniquely named PostgreSQL database.
      - run: |
          mkdir -p artifacts
          uv run --no-sync python -m pytest --basetemp artifacts/pytest
      - name: PostgreSQL diagnostics
        if: failure()
        run: docker compose logs --no-color postgres
      - name: Tear down test database
        if: always()
        run: docker compose down --volumes --remove-orphans
      - name: Upload API process logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: python-test-logs
          path: artifacts/pytest/**/api.log
          if-no-files-found: ignore
          retention-days: 7

  docker-integration:
    name: Docker assessment lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: seireth-ci
      # Exercise the published-port setting instead of relying on the example port.
      SEIRETH_API_PORT: "18080"
    steps:
      - uses: actions/checkout@v7
      - *setup-python
      - *setup-uv
      - *prepare-ci-env
      - name: Prepare runtime and images
        run: |
          uv sync --locked --extra test --no-editable
          mkdir -p artifacts
          docker build -t seireth/demo-target:local examples/demo-target
          docker pull python:3.14-slim
          uv run --no-sync python -m app docker-up --api-ready-timeout-seconds 120
          migration_containers=$(docker compose ps -a -q migrate)
          test -z "$migration_containers"
      - name: Verify real assessment and resource removal
        run: |
          set -euo pipefail
          uv run --no-sync python -m app verify --timeout-seconds 120 --expected-backend docker | tee artifacts/verification.json
          docker ps -a --format '{{.Names}}' > artifacts/container-names.txt
          docker network ls --format '{{.Name}}' > artifacts/network-names.txt
          containers=$(grep -E '^seireth-(target-|assessment-runner-)' artifacts/container-names.txt || true)
          networks=$(grep -E '^seireth-assessment-' artifacts/network-names.txt || true)
          test -z "$containers" || { echo "::error::Assessment containers remain: $containers"; exit 1; }
          test -z "$networks" || { echo "::error::Assessment networks remain: $networks"; exit 1; }
      - name: Verify real cancellation and crash recovery
        env:
          SEIRETH_DOCKER_TESTS: "1"
        run: uv run --no-sync python -m pytest tests/test_api_lifecycle.py --basetemp artifacts/api-process
      - name: Collect diagnostics
        if: always()
        run: |
          mkdir -p artifacts
          status=0
          docker compose logs --no-color > artifacts/compose.log 2>&1 || status=1
          docker ps -a > artifacts/containers.txt 2>&1 || status=1
          docker network ls > artifacts/networks.txt 2>&1 || status=1
          if [ "$status" -ne 0 ]; then
            echo "::error::Some Docker diagnostics could not be collected; inspect the available artifacts"
          fi
          exit "$status"
      - name: Tear down CI resources
        if: always()
        run: |
          # This job runs on a disposable GitHub-hosted Docker daemon.
          status=0
          docker ps -aq --filter name=seireth-target- --filter name=seireth-assessment-runner- | xargs -r docker rm -f || status=1
          docker network ls -q --filter name=seireth-assessment- | xargs -r docker network rm || status=1
          docker compose down --volumes --remove-orphans || status=1
          exit "$status"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: docker-verification
          path: artifacts/
          retention-days: 7
