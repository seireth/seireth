name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check required files and tracked environment files
        run: |
          set -euo pipefail
          for file in README.md CONTRIBUTING.md SECURITY.md LICENSE docs/{getting-started,architecture,configuration,assessments,plugins,security-model,roadmap}.md docs/assets/seireth-logo.png; do
            test -f "$file" || { echo "::error file=$file::Required file is missing"; exit 1; }
          done
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '(^|/)\.env\.example$'; then
            echo "::error::A non-example environment file is tracked"
            exit 1
          fi

  quality:
    name: Python quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
      - run: uv sync --locked --extra quality --no-build --no-install-project
      - run: uv run --no-sync --no-build python -m ruff check --output-format=github .
      - run: uv run --no-sync --no-build python -m ruff format --check .

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app/dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.16.0"
          cache: npm
          cache-dependency-path: app/dashboard/package-lock.json
      - run: npm install --global --ignore-scripts npm@11.13.0
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          fail-on-scopes: runtime, development, unknown
          vulnerability-check: true
          license-check: false
          comment-summary-in-pr: never
          warn-only: false
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 120
