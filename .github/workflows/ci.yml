name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check required files and tracked environment files
        shell: bash
        run: |
          set -euo pipefail
          for file in README.md CONTRIBUTING.md SECURITY.md LICENSE docs/{getting-started,architecture,configuration,assessments,security-model,roadmap}.md docs/assets/seireth-logo.png; do
            test -f "$file" || { echo "::error file=$file::Required file is missing"; exit 1; }
          done
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '(^|/)\.env\.example$'; then
            echo "::error::A non-example environment file is tracked"
            exit 1
          fi

  quality:
    name: Python quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install -e ".[quality]"
      - run: python -m ruff check --output-format=github .
      - run: python -m ruff format --check .

  tests:
    name: Python 3.14 tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: seireth
          POSTGRES_PASSWORD: seireth-ci
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U seireth -d postgres"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      SEIRETH_TEST_ADMIN_URL: postgresql+psycopg://seireth:seireth-ci@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install -e ".[test]"
      # conftest creates and drops a uniquely named PostgreSQL database.
      - run: python -m pytest

  docker-integration:
    name: Docker assessment lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: seireth-ci
      # Exercise the published-port setting instead of relying on the example port.
      SEIRETH_API_PORT: "18080"
      SEIRETH_TEST_ADMIN_URL: postgresql+psycopg://seireth:seireth-local@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Prepare runtime and images
        run: |
          python -m pip install ".[test]"
          cp .env.example .env
          mkdir -p artifacts
          docker build -t seireth/demo-target:local examples/demo-target
          docker pull python:3.14-slim
          python -m app docker-up --api-ready-timeout-seconds 120
          test -z "$(docker compose ps -a -q migrate)"
      - name: Verify real assessment and resource removal
        shell: bash
        run: |
          set -euo pipefail
          python -m app verify --timeout-seconds 120 --expected-backend docker | tee artifacts/verification.json
          docker ps -a --format '{{.Names}}' > artifacts/container-names.txt
          docker network ls --format '{{.Name}}' > artifacts/network-names.txt
          containers=$(grep -E '^seireth-(target-|assessment-runner-)' artifacts/container-names.txt || true)
          networks=$(grep -E '^seireth-assessment-' artifacts/network-names.txt || true)
          test -z "$containers" || { echo "::error::Assessment containers remain: $containers"; exit 1; }
          test -z "$networks" || { echo "::error::Assessment networks remain: $networks"; exit 1; }
      - name: Verify real cancellation and crash recovery
        env:
          SEIRETH_DOCKER_TESTS: "1"
        run: python -m pytest tests/test_api_process.py
      - name: Collect diagnostics
        if: always()
        run: |
          mkdir -p artifacts
          docker compose logs --no-color > artifacts/compose.log 2>&1
          docker ps -a > artifacts/containers.txt
          docker network ls > artifacts/networks.txt
      - name: Tear down CI resources
        if: always()
        shell: bash
        run: |
          # This job runs on a disposable GitHub-hosted Docker daemon.
          status=0
          docker ps -aq --filter name=seireth-target- --filter name=seireth-assessment-runner- | xargs -r docker rm -f || status=1
          docker network ls -q --filter name=seireth-assessment- | xargs -r docker network rm || status=1
          docker compose down --volumes --remove-orphans || status=1
          exit "$status"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: docker-verification
          path: artifacts/
          retention-days: 7
