name: Dependency security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    name: Audit Python runtime dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.12.9"
      - name: Install audit tools and export locked runtime dependencies
        run: |
          uv sync --locked --extra security
          uv export --locked --no-dev --no-emit-project --format requirements-txt --output-file "$RUNNER_TEMP/runtime-requirements.txt"
      - name: Audit resolved dependencies
        run: >-
          uv run --no-sync python -m pip_audit --strict --no-deps --disable-pip
          -r "$RUNNER_TEMP/runtime-requirements.txt"
          --format json --output dependency-audit.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dependency-audit
          path: dependency-audit.json
          retention-days: 7
