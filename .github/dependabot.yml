version: 2

updates:
  - package-ecosystem: npm
    directory: /app/web
    schedule: { interval: daily }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: daily }

  - package-ecosystem: uv
    directory: /
    schedule: { interval: daily }

  - package-ecosystem: docker
    directories: [/, /examples/demo-target]
    schedule: { interval: daily }
    ignore:
      # Update Node together with frontend, CI, and development pins.
      - dependency-name: node
      # Update uv together with pyproject.toml, CI, and development pins.
      - dependency-name: ghcr.io/astral-sh/uv
      # Keep Python aligned with CI, Ruff, and the sandbox runner.
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]

  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: daily }
    allow:
      # Only maintain PostgreSQL within its current major version.
      - dependency-name: postgres
        update-types: [version-update:semver-minor, version-update:semver-patch]
