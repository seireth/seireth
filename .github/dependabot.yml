version: 2
updates:
  # Node dependencies in package.json and package-lock.json.
  - package-ecosystem: npm
    directory: /app/web
    schedule:
      interval: weekly

  # Actions referenced by workflows, including commit-pinned actions.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Runtime and development dependencies in pyproject.toml and uv.lock.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly

  # Application and demo Dockerfiles, including the uv build stage.
  - package-ecosystem: docker
    directories: [/, /examples/demo-target]
    schedule:
      interval: weekly
    ignore:
      # Node must match the exact frontend, CI, and development pins.
      - dependency-name: node
        update-types: [version-update:semver-major, version-update:semver-minor, version-update:semver-patch]
      # Python 3.14 is shared with CI, Ruff, and the sandbox runner.
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]

  # Monitor the database, excluding images built locally by Compose.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    allow:
      - dependency-name: postgres
    ignore:
      # Major database upgrades require a separate data migration plan.
      - dependency-name: postgres
        update-types: [version-update:semver-major]
