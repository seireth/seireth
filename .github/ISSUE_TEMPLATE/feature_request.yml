name: Feature request
description: Propose a new capability for Seireth.
title: "[Feature]: "
labels:
  - feature
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, private target information, production data, or vulnerability details in this form.
        For security vulnerabilities in Seireth, follow [SECURITY.md](https://github.com/seireth/seireth/blob/main/SECURITY.md).
  - type: textarea
    id: proposal
    attributes:
      label: Proposed capability
      description: What new capability are you proposing?
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem and use case
      description: What problem would this solve, and who would use it?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any current workaround or alternative you considered.
    validations:
      required: true
