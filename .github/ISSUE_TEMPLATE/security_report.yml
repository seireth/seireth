name: Security report
description: Read the private security reporting policy before reporting a vulnerability.
title: "[Security]: "
labels:
  - security
body:
  - type: markdown
    attributes:
      value: |
        Please do not submit vulnerability details through a public issue.
        Use GitHub's private **Report a vulnerability** feature as described in [SECURITY.md](https://github.com/seireth/seireth/blob/main/SECURITY.md).
  - type: checkboxes
    id: acknowledged
    attributes:
      label: Reporting confirmation
      options:
        - label: I understand that this public form must not contain vulnerability details, secrets, personal data, or unauthorized target information.
          required: true
