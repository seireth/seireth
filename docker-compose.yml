name: seireth

services:
  postgres:
    image: postgres:18-trixie
    environment:
      POSTGRES_USER: seireth
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "seireth", "-d", "seireth"]
      interval: 2s
      timeout: 5s
      retries: 30

  migrate:
    profiles: [tools]
    image: ${COMPOSE_PROJECT_NAME:-seireth}-app:local
    env_file: [.env]
    environment:
      SEIRETH_DATABASE_URL: postgresql+psycopg://seireth:${POSTGRES_PASSWORD}@postgres:5432/seireth
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: ${COMPOSE_PROJECT_NAME:-seireth}-app:local
    build: .
    # docker-up detects the mounted socket's group before starting the API.
    group_add: ["${SEIRETH_DOCKER_SOCKET_GID:-65532}"]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import urllib.request
          with urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=2) as response:
              raise SystemExit(response.status != 200)
      interval: 2s
      timeout: 3s
      retries: 60
    stop_grace_period: 180s
    env_file: [.env]
    environment:
      SEIRETH_DATABASE_URL: postgresql+psycopg://seireth:${POSTGRES_PASSWORD}@postgres:5432/seireth
      SEIRETH_SANDBOX_BACKEND: docker
    ports:
      - target: 8000
        published: "${SEIRETH_API_PORT:?Set SEIRETH_API_PORT in .env}"
        host_ip: "${SEIRETH_API_HOST:?Set SEIRETH_API_HOST in .env}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
