name: seireth

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: seireth
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: seireth
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seireth -d seireth"]
      interval: 2s
      timeout: 5s
      retries: 30
  migrate:
    profiles: [tools]
    build: .
    env_file: [.env]
    environment:
      SEIRETH_DATABASE_URL: postgresql+psycopg://seireth:${POSTGRES_PASSWORD}@postgres:5432/seireth
    command: ["python", "-m", "app", "migrate"]
    depends_on:
      postgres:
        condition: service_healthy
  api:
    build: .
    stop_grace_period: 180s
    env_file: [.env]
    environment:
      SEIRETH_DATABASE_URL: postgresql+psycopg://seireth:${POSTGRES_PASSWORD}@postgres:5432/seireth
      SEIRETH_SANDBOX_BACKEND: docker
      SEIRETH_DOCKER_RUNNER_IMAGE: python:3.14-slim
    ports: ["127.0.0.1:8000:8000"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres-data:
